<div class="modal-backdrop" (click)="close.emit()">
  <section class="modal-panel perfume-modal" (click)="$event.stopPropagation()">

    <header class="modal-header">
      <div class="perfume-title-group">
        <div class="perfume-header">
          <h2>{{ perfume().name }}</h2>
          <span class="creator">by {{ perfume().creator }}</span>
        </div>
        <div class="perfume-meta">
          <span class="meta-badge">Longevity <strong class="meta-val">{{ perfume().longevity }}</strong></span>
          <span class="meta-badge">Sillage <strong class="meta-val">{{ perfume().sillage }}</strong></span>
        </div>
      </div>
    </header>

    <div class="modal-body">
      <section class="modal-section">
        <label class="section-label">Description</label>
        <p class="description-text">{{ perfume().description }}</p>
      </section>

      <section class="modal-section">
        <label class="section-label">Fragrance Notes</label>
        <div class="chips-container">
          @for (note of fragranceNotes(); track note) {
          <span class="note-chip">{{ note }}</span>
          }
        </div>
      </section>

      <section class="modal-section">
        <label class="section-label">Highlights</label>
        <ul class="pros-list">
          @for (pro of perfume().pros; track pro) {
          <li><span class="check-mark">✓</span> {{ pro }}</li>
          }
        </ul>
      </section>
    </div>

  </section>
</div>
