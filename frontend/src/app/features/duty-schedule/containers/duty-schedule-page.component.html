@if (isAdmin()) {
<section class="admin-schedule-picker">
  <label for="users">View a team member’s schedule</label>

  <select
    id="users"
    [value]="selectedUser()?.telegram_id ?? ''"
    (change)="selectUser($any($event.target).value)"
  >
    <option value="" [selected]="!selectedUser()">My schedule</option>
    @for (user of users.value() ?? []; track user.telegram_id) {
    <option
      [value]="user.telegram_id"
      [selected]="user.telegram_id === selectedUser()?.telegram_id"
    >
      {{ user.work_name }}
    </option>
    }
  </select>
</section>
}
<app-schedule-finder
  [user]="activeUser()"
></app-schedule-finder>
