@if (isAdmin()) {
<section class="admin-schedule-picker">
  <label for="users">View a team member’s schedule</label>

  <select
    id="users"
    [value]="selectedUser()?.profile.telegramId ?? ''"
    (change)="selectUser($any($event.target).value)"
  >
    <option value="" [selected]="!selectedUser()">My schedule</option>
    @for (user of users.value() ?? []; track user.profile.telegramId) {
    <option
      [value]="user.profile.telegramId"
      [selected]="user.profile.telegramId === selectedUser()?.profile.telegramId"
    >
      {{ user.work_name }}
    </option>
    }
  </select>
</section>
}
<pre>{{ session.value() | json }}</pre>
<app-schedule-finder
  [user]="activeUser()"
></app-schedule-finder>
