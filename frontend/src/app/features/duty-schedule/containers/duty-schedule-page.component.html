<main class="page-container">
  @if (store.selectedBrand(); as brand) {
  <app-brand-catalog
    [brandName]="brand"
    [perfumes]="store.brandPerfumes()"
    [soldCount]="store.soldTodayCount()"
    (backToSchedule)="store.clearBrand()"
  ></app-brand-catalog>
  } @else {
  <app-schedule-finder
    [message]="store.statusMessage()"
    [records]="store.scheduleRecords()"
    [scheduleDiff]="store.scheduleDiff()"
    (fileSelected)="store.setFile($event)"
    (submitSearch)="store.loadSchedule()"
    (openBrand)="store.selectBrand($event)"
  ></app-schedule-finder>
  }
</main>
